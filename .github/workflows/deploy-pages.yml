name: Deploy GitHub Pages

on:
  push:
    branches:
      - master
      - foundation
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  quality:
    if: vars.DATA_SAFETY_DEPLOY_APPROVED == 'true'
    uses: ./.github/workflows/data-safety-checks.yml
    with:
      upload_pages_artifact: true
      vite_supabase_url: ${{ vars.VITE_SUPABASE_URL }}
      vite_supabase_anon_key: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      vite_sync_rollout_mode: pilot

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
